<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Paciente</title>
    <link rel="stylesheet" href="/styles/deleteAccount.style.css">
</head>
<body>
    <div class="container">
        <h1>🗑️ Remover Paciente</h1>
        <p class="aviso">⚠️ Atenção: esta ação não pode ser desfeita!</p>

        <!-- O action="/deleteAccount" aponta para a rota definida no main.go -->
        <form action="/deleteAccount" method="POST"
              onsubmit="return confirm('Tem certeza que deseja remover este paciente?')">

            <label for="cpf">CPF do Paciente:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

            <button type="submit" class="btn-deletar">Remover</button>
        </form>

        <a href="/">← Voltar ao início</a>
    </div>
</body>
</html>
