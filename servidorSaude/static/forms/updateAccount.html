<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Dados do Paciente</title>
    <link rel="stylesheet" href="/styles/updateAccount.style.css">
</head>
<body>
    <div class="container">
        <h1>✏️ Atualizar Dados do Paciente</h1>

        <!-- O action="/updateAccount" aponta para a rota definida no main.go -->
        <form action="/updateAccount" method="POST">

            <label for="cpf">CPF do Paciente:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

            <label for="telefone">Novo Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="(62) 99999-9999">

            <label for="email">Novo E-mail:</label>
            <input type="email" id="email" name="email" placeholder="paciente@email.com">

            <label for="diagnostico">Novo Diagnóstico:</label>
            <textarea id="diagnostico" name="diagnostico" placeholder="Atualize o diagnóstico..."></textarea>

            <button type="submit">Atualizar</button>
        </form>

        <a href="/">← Voltar ao início</a>
    </div>
</body>
</html>
